<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fdcd6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d2c30" media="(prefers-color-scheme: dark)">
<title>Flip 7 · Contador de puntajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#8fdcd6; --dot:rgba(16,70,74,.13);
  --surface:#fffdf4; --surface-2:#eef7f5;
  --text:#13232a; --muted:#45565c;
  --line:#16252c; --logo-line:#16252c;
  --yellow:#ffd23f; --yellow-ink:#2a2100;
  --red:#d62828; --red-dark:#a81d1d;
  --gold:#d29b00; --gold-soft:#fff6d1;
  --green:#1d8a4b; --green-soft:#ddf6e6;
  --orange:#e46b00;
  --field:#ffffff; --track:#d3e9e6;
  --focus:#1546d6;
  --bar-bg:rgba(255,253,244,.95);
  --font-display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d2c30; --dot:rgba(143,220,214,.07);
    --surface:#163a3f; --surface-2:#0f3034;
    --text:#eef6f5; --muted:#a9c4c2;
    --line:#04171a;
    --gold:#ffcf2e; --gold-soft:#33300f;
    --green:#45d283; --green-soft:#103626;
    --orange:#ff9a3c;
    --field:#0c272b; --track:#0a2326;
    --focus:#9fc0ff;
    --bar-bg:rgba(13,44,48,.95);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d2c30; --dot:rgba(143,220,214,.07);
  --surface:#163a3f; --surface-2:#0f3034;
  --text:#eef6f5; --muted:#a9c4c2;
  --line:#04171a;
  --gold:#ffcf2e; --gold-soft:#33300f;
  --green:#45d283; --green-soft:#103626;
  --orange:#ff9a3c;
  --field:#0c272b; --track:#0a2326;
  --focus:#9fc0ff;
  --bar-bg:rgba(13,44,48,.95);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);
  background-size:18px 18px;
  color:var(--text);
  font:400 1rem/1.45 var(--font-body);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding:14px 16px 128px}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 16px}
.logo{
  margin:0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(2.7rem,13vw,3.7rem);line-height:.95;letter-spacing:.02em;
  color:var(--yellow);
  -webkit-text-stroke:3px var(--logo-line);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--red);
  transform:rotate(-3deg);
  white-space:nowrap;
}
.meta{text-align:right}
.meta p{margin:0}
.game-label{font-family:var(--font-display);font-size:1.05rem;line-height:1.2}
.goal{font-size:.86rem;color:var(--muted);font-weight:500}

/* Banner fin de juego */
.banner{
  background:var(--yellow);color:var(--yellow-ink);
  border:3px solid var(--line);border-radius:20px;
  box-shadow:0 5px 0 var(--red);
  padding:16px;margin:0 0 18px;text-align:center;
}
.banner p{margin:0 0 12px;font-family:var(--font-display);font-size:1.45rem;line-height:1.2}
.banner p:last-child{margin-bottom:0}
.banner.tie p{font-size:1.2rem}

/* Botones */
.btn{
  min-height:48px;padding:10px 16px;border-radius:14px;
  border:2.5px solid var(--line);background:var(--surface);
  font-weight:700;font-size:1rem;width:100%;
  box-shadow:0 3px 0 var(--line);
  transition:transform .08s ease,box-shadow .08s ease,background-color .2s;
}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn-ink{background:var(--line);color:var(--yellow);border-color:var(--line);box-shadow:0 3px 0 var(--red-dark)}
:root[data-theme="dark"] .btn-ink{background:#04171a}
.btn-danger{color:var(--red);background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-danger{color:#ff8a8a}}
:root[data-theme="dark"] .btn-danger{color:#ff8a8a}
.btn-danger.armed{background:var(--red);color:#fff;border-color:var(--line)}

/* Tarjetas */
.cards{display:flex;flex-direction:column;gap:14px}
.card{
  position:relative;
  background:var(--surface);
  border:3px solid var(--line);border-radius:20px;
  padding:12px 14px 12px;
  box-shadow:0 4px 0 var(--line);
  transition:border-color .2s,box-shadow .2s,background-color .2s;
}
.card.lead{border-color:var(--gold);box-shadow:0 4px 0 var(--gold);background:linear-gradient(var(--gold-soft),var(--surface) 70%)}
.card.win{border-color:var(--green);box-shadow:0 4px 0 var(--green);background:linear-gradient(var(--green-soft),var(--surface) 70%)}
.card.pending{border-color:var(--orange);box-shadow:0 4px 0 var(--orange)}

.card-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.rank{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-2);border:2px solid var(--line);
  font-family:var(--font-display);font-size:.95rem;line-height:1;
}
.who{min-width:0}
.name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{margin:0;font-size:1.2rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tag{
  font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;
  border:2px solid var(--line);line-height:1.3;
}
.tag.lead{background:var(--yellow);color:var(--yellow-ink)}
.tag.win{background:var(--green);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.win{color:#04171a}}
:root[data-theme="dark"] .tag.win{color:#04171a}
.last{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.total{
  font-family:var(--font-display);font-size:2.6rem;line-height:1;
  font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;
}

.progress{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.track{flex:1;height:12px;border-radius:999px;background:var(--track);border:2px solid var(--line);overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#ffbf00 8px 16px);border-right:2px solid var(--line);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.fill.zero{border-right:0}
.card.win .fill{background:var(--green)}
.togo{font-size:.8rem;color:var(--muted);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}

.entry-label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:0 0 5px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.pts{
  width:100%;min-height:50px;padding:6px 12px;
  border:2.5px solid var(--line);border-radius:14px;
  background:var(--field);
  font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;
}
.pts::placeholder{color:var(--muted);opacity:.7;font-weight:500;font-size:1rem}
.pts:disabled{opacity:.5;background:repeating-linear-gradient(-45deg,var(--field) 0 6px,var(--surface-2) 6px 12px)}
.tog{
  min-height:50px;padding:0 12px;border-radius:14px;
  border:2.5px solid var(--line);background:var(--surface-2);
  font-weight:700;font-size:.95rem;white-space:nowrap;
  transition:background-color .15s,color .15s,transform .08s;
}
.tog:active:not(:disabled){transform:scale(.96)}
.tog.flip[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.tog.bust[aria-pressed="true"]{background:var(--red);color:#fff}
.tog:disabled,.pts:disabled{opacity:.45}
.hint{margin:7px 0 0;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint strong{color:var(--text)}

/* Acciones y secciones */
.actions{margin:18px 0 14px}
.panel{
  background:var(--surface);border:3px solid var(--line);border-radius:20px;
  margin:0 0 14px;overflow:hidden;
}
.panel summary{
  list-style:none;min-height:52px;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-weight:700;font-size:1.05rem;cursor:pointer;
}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"";width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.panel[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
.panel summary:focus-visible{outline-offset:-4px}
.panel-body{padding:0 16px 16px}
.empty{margin:0;color:var(--muted);font-size:.92rem}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.chip{background:var(--yellow);color:var(--yellow-ink);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem}
.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.game{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.game-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.game-head strong{font-family:var(--font-display);font-weight:400;font-size:1.05rem}
.game-winner{font-weight:700}
.game-sub{margin:2px 0 6px;font-size:.8rem;color:var(--muted)}
.scores{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.92rem}
.scores li{display:contents}
.scores .w{font-weight:700}
.scores span:last-child{text-align:right;font-variant-numeric:tabular-nums}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:.92rem;min-width:100%}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--track)}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:.8rem}
th[scope="row"],thead th:first-child{
  position:sticky;left:0;z-index:1;text-align:left;
  background:var(--surface);border-right:2px solid var(--line);font-weight:700;color:var(--text);
}
thead th:first-child{background:var(--surface-2)}
td.tot{font-weight:700;background:var(--surface-2)}
.mk{font-size:.7rem;font-weight:700;margin-left:3px;vertical-align:1px}
.mk.b{color:var(--red)}
.mk.f{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mk.b{color:#ff8a8a}}
:root[data-theme="dark"] .mk.b{color:#ff8a8a}
td.nd{color:var(--muted)}
.legend{margin:8px 0 0;font-size:.78rem;color:var(--muted)}

.danger{display:flex;flex-direction:column;gap:10px;margin:22px 0 10px}
.foot{margin:14px 0 0;text-align:center;font-size:.8rem;color:var(--muted)}

/* Barra fija */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bar-bg);
  border-top:3px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.bar-inner{max-width:528px;margin:0 auto}
.btn-close{
  width:100%;min-height:58px;border-radius:16px;
  border:3px solid var(--line);
  background:var(--red);color:#fff;
  font-family:var(--font-display);font-size:1.3rem;letter-spacing:.01em;
  box-shadow:0 4px 0 var(--line);
  transition:transform .08s,box-shadow .08s,background-color .2s;
}
.btn-close:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-close.ready{background:var(--green)}
.btn-close:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none}

/* Aviso */
.toast{
  position:fixed;left:50%;z-index:30;
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  transform:translate(-50%,12px);opacity:0;
  width:min(528px,calc(100% - 32px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--line);color:#fff;
  border-radius:14px;padding:8px 8px 8px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
  transition:opacity .2s,transform .2s;
}
:root[data-theme="dark"] .toast{background:#eef6f5;color:#13232a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#eef6f5;color:#13232a}}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast span{font-weight:500;font-size:.95rem}
.toast button{min-height:46px;padding:0 14px;border-radius:10px;border:0;background:var(--yellow);color:var(--yellow-ink);font-weight:700}
.toast button[hidden]{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="logo">FLIP 7</h1>
    <div class="meta">
      <p class="game-label" id="gameLabel">Juego 2 · Ronda 1</p>
      <p class="goal">Gana quien llega a 200</p>
    </div>
  </header>

  <section id="banner" class="banner" hidden aria-live="polite">
    <p id="bannerText"></p>
    <button type="button" id="saveGame" class="btn btn-ink">Guardar juego y empezar otro</button>
  </section>

  <section id="cards" class="cards" aria-label="Puntajes por jugador"></section>

  <div class="actions">
    <button type="button" id="undo" class="btn">Deshacer última ronda</button>
  </div>

  <details id="histDetails" class="panel">
    <summary>Historial de juegos</summary>
    <div class="panel-body" id="history"></div>
  </details>

  <details id="roundsDetails" class="panel">
    <summary>Rondas del juego actual</summary>
    <div class="panel-body" id="rounds"></div>
  </details>

  <div class="danger">
    <button type="button" id="discard" class="btn btn-danger">Descartar juego actual</button>
    <button type="button" id="clearHist" class="btn btn-danger">Borrar historial de juegos</button>
  </div>
  <p class="foot">Enter en el teclado pasa al siguiente jugador</p>
</div>

<div class="bar">
  <div class="bar-inner">
    <button type="button" id="closeRound" class="btn-close">Cerrar ronda</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span></span>
  <button type="button" hidden></button>
</div>

<script>
(function(){
  'use strict';

  var PLAYERS = ['Wato','Ware','Exe','Jose','Joseto','Mati','Vicho','Simon','Mono'];
  var TARGET = 200, BONUS = 15, KEY = 'flip7-contador-v1';

  var $ = function(s){ return document.querySelector(s); };
  var reducedMotion = false;
  try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- Estado ---------- */
  function emptyDraft(){ return { p:'', f:false, b:false }; }
  function defaultState(){
    return {
      v:1,
      players: PLAYERS.slice(),
      rounds: [],
      drafts: PLAYERS.map(emptyDraft),
      history: [{ n:1, winner:'Simon', scores:null, rounds:0, date:null }],
      ui: { histOpen:true, roundsOpen:false }
    };
  }
  function toInt(x){ var n = parseInt(x,10); return isNaN(n) ? 0 : n; }

  function sanitize(s){
    var d = defaultState();
    if (!s || typeof s !== 'object') return d;
    var players = (Array.isArray(s.players) && s.players.length && s.players.every(function(p){ return typeof p === 'string'; })) ? s.players : d.players;
    function cleanEntry(e){
      e = e || {};
      return { p: Math.max(0, Math.min(999, toInt(e.p))), f: !!e.f && !e.b, b: !!e.b, n: !!e.n };
    }
    var rounds = Array.isArray(s.rounds) ? s.rounds.filter(Array.isArray).map(function(r){
      return players.map(function(_, i){ return cleanEntry(r[i]); });
    }) : [];
    var drafts = players.map(function(_, i){
      var x = Array.isArray(s.drafts) ? s.drafts[i] : null;
      if (!x || typeof x !== 'object') return emptyDraft();
      var b = !!x.b;
      return { p: b ? '' : String(x.p == null ? '' : x.p).replace(/\D/g,'').slice(0,3), f: !!x.f && !b, b: b };
    });
    var history = Array.isArray(s.history) ? s.history.filter(function(h){ return h && typeof h.winner === 'string'; }).map(function(h){
      return {
        n: toInt(h.n),
        winner: h.winner,
        scores: Array.isArray(h.scores) ? h.scores.filter(function(x){ return x && typeof x.name === 'string'; }).map(function(x){ return { name:x.name, total:toInt(x.total) }; }) : null,
        rounds: toInt(h.rounds),
        date: typeof h.date === 'string' ? h.date : null
      };
    }) : d.history;
    var ui = { histOpen: !(s.ui && s.ui.histOpen === false), roundsOpen: !!(s.ui && s.ui.roundsOpen) };
    return { v:1, players:players, rounds:rounds, drafts:drafts, history:history, ui:ui };
  }

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      return sanitize(JSON.parse(raw));
    } catch(e){ return defaultState(); }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  var state = load();
  var refs = [];

  /* ---------- Cálculos ---------- */
  function hasData(d){ return d.p !== '' || d.f || d.b; }
  function entryScore(e){ return e.b ? 0 : e.p + (e.f ? BONUS : 0); }
  function draftScore(d){ return d.b ? 0 : toInt(d.p) + (d.f ? BONUS : 0); }
  function totals(){
    return state.players.map(function(_, i){
      return state.rounds.reduce(function(a, r){ return a + entryScore(r[i]); }, 0);
    });
  }
  function order(tot){
    return state.players.map(function(_, i){ return i; }).sort(function(a, b){
      return (tot[b] - tot[a]) || (a - b);
    });
  }
  function gameNumber(){
    return state.history.reduce(function(m, h){ return Math.max(m, h.n); }, 0) + 1;
  }
  function standing(tot){
    var M = Math.max.apply(null, tot);
    var tops = [];
    tot.forEach(function(t, i){ if (t === M) tops.push(i); });
    return { M:M, tops:tops, over: M >= TARGET && tops.length === 1, tie: M >= TARGET && tops.length > 1 };
  }

  /* ---------- Tarjetas ---------- */
  function buildCards(){
    var list = $('#cards');
    list.textContent = '';
    refs = state.players.map(function(name, i){
      var el = document.createElement('article');
      el.className = 'card';
      var safe = esc(name);
      el.innerHTML =
        '<div class="card-top">' +
          '<span class="rank" aria-hidden="true"></span>' +
          '<div class="who">' +
            '<div class="name-row"><h2 class="name">' + safe + '</h2><span class="tag" hidden></span></div>' +
            '<p class="last" hidden></p>' +
          '</div>' +
          '<div class="total" aria-label="Total de ' + safe + '">0</div>' +
        '</div>' +
        '<div class="progress"><div class="track" aria-hidden="true"><div class="fill"></div></div><span class="togo"></span></div>' +
        '<label class="entry-label" for="pts-' + i + '">Puntos de la ronda</label>' +
        '<div class="entry">' +
          '<input class="pts" id="pts-' + i + '" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" enterkeyhint="next" placeholder="0" aria-describedby="hint-' + i + '">' +
          '<button type="button" class="tog flip" aria-pressed="false" aria-label="Flip 7, suma 15 a ' + safe + '">+15 Flip 7</button>' +
          '<button type="button" class="tog bust" aria-pressed="false" aria-label="Bust de ' + safe + '">Bust</button>' +
        '</div>' +
        '<p class="hint" id="hint-' + i + '"></p>';

      var r = {
        el: el,
        rank: el.querySelector('.rank'),
        tag: el.querySelector('.tag'),
        last: el.querySelector('.last'),
        total: el.querySelector('.total'),
        fill: el.querySelector('.fill'),
        togo: el.querySelector('.togo'),
        input: el.querySelector('.pts'),
        flip: el.querySelector('.flip'),
        bust: el.querySelector('.bust'),
        hint: el.querySelector('.hint')
      };

      r.input.addEventListener('input', function(){
        var v = r.input.value.replace(/\D/g,'').slice(0,3);
        if (v !== r.input.value) r.input.value = v;
        state.drafts[i].p = v;
        save(); updateAll();
      });
      r.input.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter'){ ev.preventDefault(); focusNext(i); }
      });
      r.flip.addEventListener('click', function(){
        var d = state.drafts[i];
        d.f = !d.f;
        if (d.f) d.b = false;
        save(); updateAll();
      });
      r.bust.addEventListener('click', function(){
        var d = state.drafts[i];
        d.b = !d.b;
        if (d.b){ d.f = false; d.p = ''; r.input.value = ''; }
        save(); updateAll();
        if (!d.b) r.input.focus();
      });
      return r;
    });
    order(totals()).forEach(function(i){ list.appendChild(refs[i].el); });
    syncInputs();
  }

  function syncInputs(){
    refs.forEach(function(r, i){ r.input.value = state.drafts[i].p; });
  }

  function reorder(){
    var list = $('#cards');
    order(totals()).forEach(function(i){ list.appendChild(refs[i].el); });
  }

  function domOrder(){
    var els = Array.prototype.slice.call($('#cards').children);
    return els.map(function(el){
      for (var i = 0; i < refs.length; i++) if (refs[i].el === el) return i;
      return -1;
    }).filter(function(i){ return i >= 0; });
  }

  function focusNext(i){
    var ord = domOrder();
    var pos = ord.indexOf(i);
    for (var k = pos + 1; k < ord.length; k++){
      var inp = refs[ord[k]].input;
      if (!inp.disabled){ inp.focus(); return; }
    }
    refs[i].input.blur();
    $('#closeRound').focus();
  }

  function describeLast(e){
    if (e.n) return 'Última ronda: sin dato';
    if (e.b) return 'Última ronda: Bust';
    return 'Última ronda: +' + entryScore(e) + (e.f ? ' con Flip 7' : '');
  }

  /* ---------- Actualización ---------- */
  function updateAll(){
    var tot = totals();
    var st = standing(tot);
    var ord = domOrder();

    refs.forEach(function(r, i){
      var d = state.drafts[i];
      var t = tot[i];
      var s = draftScore(d);
      var pending = !st.over && !hasData(d);

      r.rank.textContent = ord.indexOf(i) + 1;
      r.total.textContent = t;
      var pct = Math.min(t / TARGET, 1) * 100;
      r.fill.style.width = pct + '%';
      r.fill.classList.toggle('zero', pct === 0);
      r.togo.textContent = t >= TARGET ? 'Llegó a 200' : 'Faltan ' + (TARGET - t);

      if (state.rounds.length){
        r.last.hidden = false;
        r.last.textContent = describeLast(state.rounds[state.rounds.length - 1][i]);
      } else {
        r.last.hidden = true;
      }

      var isTop = st.tops.indexOf(i) >= 0;
      var tagText = '', tagCls = '';
      if (st.over && isTop){ tagText = 'Gana'; tagCls = 'win'; }
      else if (st.tie && isTop){ tagText = 'Empate'; tagCls = 'lead'; }
      else if (st.M > 0 && isTop){ tagText = 'Lidera'; tagCls = 'lead'; }
      r.tag.hidden = !tagText;
      r.tag.textContent = tagText;
      r.tag.className = 'tag ' + tagCls;

      r.el.classList.toggle('win', tagCls === 'win');
      r.el.classList.toggle('lead', tagCls === 'lead');
      r.el.classList.toggle('pending', pending);

      r.flip.setAttribute('aria-pressed', d.f ? 'true' : 'false');
      r.bust.setAttribute('aria-pressed', d.b ? 'true' : 'false');
      r.input.disabled = d.b || st.over;
      r.flip.disabled = st.over;
      r.bust.disabled = st.over;
      r.input.placeholder = d.b ? 'Bust' : '0';

      var note = '';
      if (d.b) note = ' · Bust';
      else if (d.f) note = ' · incluye Flip 7';
      else if (!hasData(d)) note = ' · sin dato';
      r.hint.innerHTML = 'Esta ronda: +' + s + ' → <strong>' + (t + s) + '</strong>' + note;
    });

    $('#gameLabel').textContent = 'Juego ' + gameNumber() + ' · Ronda ' + (state.rounds.length + 1);

    var banner = $('#banner');
    if (st.over){
      banner.hidden = false;
      banner.classList.remove('tie');
      $('#bannerText').textContent = state.players[st.tops[0]] + ' gana con ' + st.M;
      $('#saveGame').hidden = false;
    } else if (st.tie){
      banner.hidden = false;
      banner.classList.add('tie');
      $('#bannerText').textContent = 'Empate arriba, jueguen otra ronda';
      $('#saveGame').hidden = true;
    } else {
      banner.hidden = true;
    }

    var missing = state.drafts.filter(function(d){ return !hasData(d); }).length;
    var btn = $('#closeRound');
    if (st.over){
      btn.disabled = true;
      btn.textContent = 'Juego terminado';
      btn.classList.remove('ready');
    } else {
      btn.disabled = false;
      btn.textContent = missing ? 'Cerrar ronda (faltan ' + missing + ')' : 'Cerrar ronda';
      btn.classList.toggle('ready', missing === 0);
    }

    $('#undo').disabled = state.rounds.length === 0;
    $('#discard').disabled = state.rounds.length === 0 && !state.drafts.some(hasData);
    $('#clearHist').disabled = state.history.length === 0;
  }

  /* ---------- Tabla de rondas ---------- */
  function renderRounds(){
    var box = $('#rounds');
    if (!state.rounds.length){
      box.innerHTML = '<p class="empty">Las rondas aparecen aquí cuando cierras la primera.</p>';
      return;
    }
    var tot = totals();
    var ord = domOrder();
    var h = '<div class="table-wrap"><table><thead><tr><th scope="col">Jugador</th>';
    state.rounds.forEach(function(_, k){ h += '<th scope="col">R' + (k + 1) + '</th>'; });
    h += '<th scope="col">Total</th></tr></thead><tbody>';
    ord.forEach(function(i){
      h += '<tr><th scope="row">' + esc(state.players[i]) + '</th>';
      state.rounds.forEach(function(r){
        var e = r[i];
        if (e.n) h += '<td class="nd" title="Sin dato">0</td>';
        else if (e.b) h += '<td>0<span class="mk b">B</span></td>';
        else h += '<td>' + entryScore(e) + (e.f ? '<span class="mk f">F7</span>' : '') + '</td>';
      });
      h += '<td class="tot">' + tot[i] + '</td></tr>';
    });
    h += '</tbody></table></div><p class="legend">B = Bust · F7 = Flip 7 (ya incluye +15) · gris = sin dato</p>';
    box.innerHTML = h;
  }

  /* ---------- Historial ---------- */
  function fmtDate(iso){
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString('es-CL', { day:'numeric', month:'short' }); } catch(e){ return ''; }
  }
  function renderHistory(){
    var box = $('#history');
    if (!state.history.length){
      box.innerHTML = '<p class="empty">Aún no hay juegos guardados. El primero aparece aquí al terminar.</p>';
      return;
    }
    var wins = {};
    state.history.forEach(function(g){ wins[g.winner] = (wins[g.winner] || 0) + 1; });
    var names = Object.keys(wins).sort(function(a, b){ return (wins[b] - wins[a]) || a.localeCompare(b, 'es'); });
    var h = '<ul class="chips" aria-label="Victorias por jugador">';
    names.forEach(function(n){
      h += '<li class="chip">' + esc(n) + ' · ' + wins[n] + (wins[n] === 1 ? ' victoria' : ' victorias') + '</li>';
    });
    h += '</ul><ul class="games">';
    state.history.slice().sort(function(a, b){ return b.n - a.n; }).forEach(function(g){
      var sub = [];
      if (g.rounds) sub.push(g.rounds + (g.rounds === 1 ? ' ronda' : ' rondas'));
      var dt = fmtDate(g.date);
      if (dt) sub.push(dt);
      h += '<li class="game"><div class="game-head"><strong>Juego ' + g.n + '</strong><span class="game-winner">Ganó ' + esc(g.winner) + '</span></div>';
      if (sub.length) h += '<p class="game-sub">' + esc(sub.join(' · ')) + '</p>';
      if (g.scores && g.scores.length){
        h += '<ol class="scores">';
        g.scores.slice().sort(function(a, b){ return b.total - a.total; }).forEach(function(x){
          var w = x.name === g.winner ? ' class="w"' : '';
          h += '<li><span' + w + '>' + esc(x.name) + '</span><span' + w + '>' + x.total + '</span></li>';
        });
        h += '</ol>';
      } else {
        h += '<p class="empty">Sin puntajes registrados</p>';
      }
      h += '</li>';
    });
    h += '</ul>';
    box.innerHTML = h;
  }

  /* ---------- Acciones ---------- */
  function scrollTop(){
    try { window.scrollTo({ top:0, behavior: reducedMotion ? 'auto' : 'smooth' }); } catch(e){ window.scrollTo(0,0); }
  }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

  function closeRound(){
    if (standing(totals()).over) return;
    var round = state.drafts.map(function(d){
      if (!hasData(d)) return { p:0, f:false, b:false, n:true };
      return { p: d.b ? 0 : toInt(d.p), f: d.b ? false : d.f, b: d.b, n:false };
    });
    state.rounds.push(round);
    state.drafts = state.players.map(emptyDraft);
    save();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    syncInputs(); reorder(); updateAll(); renderRounds();
    scrollTop(); buzz(25);
    toast('Ronda ' + state.rounds.length + ' cerrada', 'Deshacer', undoRound);
  }

  function undoRound(){
    if (!state.rounds.length) return;
    var r = state.rounds.pop();
    state.drafts = r.map(function(e){
      if (e.n) return emptyDraft();
      return { p: e.b ? '' : String(e.p), f: e.f, b: e.b };
    });
    save();
    syncInputs(); reorder(); updateAll(); renderRounds();
    toast('Ronda ' + (state.rounds.length + 1) + ' deshecha, sus puntos volvieron a los campos');
  }

  function resetCurrent(){
    state.rounds = [];
    state.drafts = state.players.map(emptyDraft);
    save();
    buildCards(); updateAll(); renderRounds();
    scrollTop();
  }

  function saveGame(){
    var tot = totals();
    var st = standing(tot);
    if (!st.over) return;
    var winner = state.players[st.tops[0]];
    state.history.push({
      n: gameNumber(),
      winner: winner,
      scores: order(tot).map(function(i){ return { name: state.players[i], total: tot[i] }; }),
      rounds: state.rounds.length,
      date: new Date().toISOString()
    });
    resetCurrent();
    renderHistory(); updateAll();
    toast('Juego guardado, ganó ' + winner);
  }

  function discardGame(){
    resetCurrent();
    toast('Juego descartado');
  }

  function clearHistory(){
    state.history = [];
    save();
    renderHistory(); updateAll();
    toast('Historial borrado');
  }

  function armConfirm(btn, confirmText, action){
    var label = btn.textContent, timer = null;
    function disarm(){ clearTimeout(timer); btn.classList.remove('armed'); btn.textContent = label; btn.dataset.armed = ''; }
    btn.addEventListener('click', function(){
      if (btn.dataset.armed === '1'){ disarm(); action(); return; }
      btn.dataset.armed = '1';
      btn.classList.add('armed');
      btn.textContent = confirmText;
      timer = setTimeout(disarm, 3500);
    });
    btn.addEventListener('blur', function(){ if (btn.dataset.armed === '1') disarm(); });
  }

  /* ---------- Aviso ---------- */
  var toastTimer = null;
  function hideToast(){
    var t = $('#toast');
    t.classList.remove('show');
    setTimeout(function(){ if (!t.classList.contains('show')) t.hidden = true; }, reducedMotion ? 0 : 220);
  }
  function toast(msg, actionLabel, action){
    var t = $('#toast'), b = t.querySelector('button');
    t.querySelector('span').textContent = msg;
    if (actionLabel){
      b.hidden = false; b.textContent = actionLabel;
      b.onclick = function(){ hideToast(); action(); };
    } else {
      b.hidden = true; b.onclick = null;
    }
    t.hidden = false;
    requestAnimationFrame(function(){ t.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actionLabel ? 5000 : 3000);
  }

  /* ---------- Pantalla encendida durante el juego ---------- */
  var wakeLock = null;
  function keepAwake(){
    try {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock = l;
        l.addEventListener('release', function(){ wakeLock = null; });
      }).catch(function(){});
    } catch(e){}
  }

  /* ---------- Inicio ---------- */
  var hd = $('#histDetails'), rd = $('#roundsDetails');
  hd.open = state.ui.histOpen;
  rd.open = state.ui.roundsOpen;
  hd.addEventListener('toggle', function(){ state.ui.histOpen = hd.open; save(); });
  rd.addEventListener('toggle', function(){ state.ui.roundsOpen = rd.open; save(); });

  $('#closeRound').addEventListener('click', closeRound);
  $('#undo').addEventListener('click', undoRound);
  $('#saveGame').addEventListener('click', saveGame);
  armConfirm($('#discard'), 'Toca otra vez para descartar el juego', discardGame);
  armConfirm($('#clearHist'), 'Toca otra vez para borrar el historial', clearHistory);

  document.addEventListener('pointerdown', keepAwake, { passive:true });
  document.addEventListener('visibilitychange', keepAwake);

  buildCards();
  updateAll();
  renderRounds();
  renderHistory();
})();
</script>
</body>
</html>
